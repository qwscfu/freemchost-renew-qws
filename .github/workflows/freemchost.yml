name: Freemchost Auto Renew & Keepalive

on:
  workflow_dispatch:
  # schedule 定时已交由外部白虎面板精准触发，避免 GitHub 队列调度延迟

permissions:
  actions: write
  contents: read

jobs:
  browser-auto-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Playwright 浏览器依赖
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: 安装依赖与 Chromium 内核
        run: |
          npm init -y
          npm install playwright js-yaml
          npx playwright install chromium

      - name: 🚀 启动代理内核（如有配置 NODE_LINK）
        if: ${{ env.NODE_LINK != '' }}
        run: |
          echo "🌐 识别到 NODE_LINK，初始化代理转换..."
          
          # 1. 节点硬编码临时 HTTP 托管
          echo "$NODE_LINK" > node.txt
          python3 -m http.server 8080 &
          
          # 2. 下载并启动 Subconverter
          wget -qO sub.tar.gz https://github.com/tindy2013/subconverter/releases/latest/download/subconverter_linux64.tar.gz
          tar -xf sub.tar.gz
          nohup ./subconverter/subconverter > sub.log 2>&1 &
          sleep 2
          
          # 3. 下载并解压 Mihomo 内核
          wget -qO mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.2/mihomo-linux-amd64-v1.18.2.gz
          gunzip mihomo.gz
          chmod +x mihomo
          
          # 4. 生成配置解析脚本
          cat << 'EOF' > parse_node.js
          const fs = require('fs');
          const http = require('http');
          const url = require('url');
          const yaml = require('js-yaml');

          const nodeLink = (process.env.NODE_LINK || '').trim();

          async function trySubconverter() {
            return new Promise((resolve) => {
              http.get('http://127.0.0.1:25500/sub?target=clash&url=http://127.0.0.1:8080/node.txt&insert=false', (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  if (data.includes('proxies:') && data.includes('name:')) {
                    resolve(data);
                  } else {
                    resolve(null);
                  }
                });
              }).on('error', () => resolve(null));
            });
          }

          function parseRawLink(link) {
            link = link.trim();
            if (link.startsWith('socks5://') || link.startsWith('socks://')) {
              const u = new url.URL(link);
              return { name: 'node', type: 'socks5', server: u.hostname, port: parseInt(u.port || '1080'), username: u.username || '', password: u.password || '' };
            }
            if (link.startsWith('hysteria2://') || link.startsWith('hy2://')) {
              const u = new url.URL(link.replace('hy2://', 'hysteria2://'));
              const pwd = u.username || (u.pathname || '').replace(/^\/\//, '').split('@')[0].split(':')[0];
              const n = { name: 'node', type: 'hysteria2', server: u.hostname, port: parseInt(u.port || '443'), password: pwd };
              if (u.searchParams.get('sni')) n.sni = u.searchParams.get('sni');
              if (['1', 'true'].includes(u.searchParams.get('insecure'))) n['skip-cert-verify'] = true;
              return n;
            }
            if (link.startsWith('tuic://')) {
              const u = new url.URL(link);
              const uinfo = (u.username || '').split(':');
              const n = { name: 'node', type: 'tuic', server: u.hostname, port: parseInt(u.port || '443'), uuid: uinfo[0], password: uinfo[1] || '', 'congestion-controller': u.searchParams.get('congestion_control') || 'bbr' };
              if (u.searchParams.get('sni')) n.sni = u.searchParams.get('sni');
              if (['1', 'true'].includes(u.searchParams.get('insecure'))) n['skip-cert-verify'] = true;
              return n;
            }
            if (link.startsWith('vless://')) {
              const u = new url.URL(link);
              const sec = u.searchParams.get('security') || '';
              const n = { name: 'node', type: 'vless', server: u.hostname, port: parseInt(u.port || '443'), uuid: u.username, tls: ['tls', 'reality'].includes(sec), network: u.searchParams.get('type') || 'tcp' };
              if (u.searchParams.get('sni')) n.servername = u.searchParams.get('sni');
              if (u.searchParams.get('fp')) n['client-fingerprint'] = u.searchParams.get('fp');
              if (sec === 'reality') {
                n['reality-opts'] = { 'public-key': u.searchParams.get('pbk') || '' };
                if (u.searchParams.get('sid')) n['reality-opts']['short-id'] = u.searchParams.get('sid');
              }
              if (n.network === 'ws') {
                n['ws-opts'] = { path: u.searchParams.get('path') || '/' };
                if (u.searchParams.get('host')) n['ws-opts'].headers = { Host: u.searchParams.get('host') };
              } else if (n.network === 'grpc') {
                n['grpc-opts'] = { 'grpc-service-name': u.searchParams.get('serviceName') || '' };
              }
              return n;
            }
            if (link.startsWith('vmess://')) {
              let b64 = link.substring(8);
              b64 += '='.repeat((4 - (b64.length % 4)) % 4);
              const data = JSON.parse(Buffer.from(b64, 'base64').toString('utf-8'));
              const n = { name: 'node', type: 'vmess', server: data.add, port: parseInt(data.port || 443), uuid: data.id, alterId: parseInt(data.aid || 0), cipher: 'auto', tls: data.tls === 'tls', network: data.net || 'tcp' };
              if (data.sni) n.servername = data.sni;
              if (n.network === 'ws') {
                n['ws-opts'] = { path: data.path || '/' };
                if (data.host) n['ws-opts'].headers = { Host: data.host };
              }
              return n;
            }
            if (link.startsWith('trojan://')) {
              const u = new url.URL(link);
              const n = { name: 'node', type: 'trojan', server: u.hostname, port: parseInt(u.port || '443'), password: u.username };
              if (u.searchParams.get('sni')) n.sni = u.searchParams.get('sni');
              if (['1', 'true'].includes(u.searchParams.get('allowInsecure'))) n['skip-cert-verify'] = true;
              return n;
            }
            return null;
          }

          (async () => {
            const subRes = await trySubconverter();
            if (subRes) {
              console.log('✅ Subconverter 转换成功');
              fs.writeFileSync('config.yaml', 'socks-port: 7891\nallow-lan: true\nmode: global\n' + subRes);
            } else {
              console.log('⚠️ Subconverter 未生效，切换原生节点解析...');
              const nodeObj = parseRawLink(nodeLink);
              if (!nodeObj) {
                console.error('❌ 无法识别 NODE_LINK 格式');
                process.exit(1);
              }
              
              const configObj = {
                'socks-port': 7891,
                'allow-lan': true,
                'mode': 'global',
                'proxies': [ nodeObj ]
              };
              
              fs.writeFileSync('config.yaml', yaml.dump(configObj));
            }
            console.log('✅ Mihomo 配置文件 config.yaml 就绪');
          })();
          EOF
          
          # 执行节点配置生成
          node parse_node.js
          
          # 启动后台 Mihomo
          nohup ./mihomo -d . -f config.yaml > mihomo.log 2>&1 &
          sleep 4
          
          # 连通性测试
          if nc -z 127.0.0.1 7891; then
            echo "🎉 代理内核启动完成，SOCKS5 端口: 127.0.0.1:7891"
          else
            echo "❌ 代理内核启动失败，查看日志:"
            cat config.yaml
            cat mihomo.log
            exit 1
          fi

      - name: 运行保活与自动续期任务
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL || 'yuxiaojie0322@gmail.com' }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD || 'YxJ223512@' }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL || 'https://freemchost.com/app/servers/1df49f71-bb1b-454c-9cd1-70a46422a4f6' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL || (env.NODE_LINK != '' && 'socks5://127.0.0.1:7891' || '') }}
        run: node renew.js

      - name: 归档运行截图凭据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Freemchost-Screenshots-${{ github.run_number }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧹 清理历史运行日志（保留最新 3 次）
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0      
          keep_minimum_runs: 3
