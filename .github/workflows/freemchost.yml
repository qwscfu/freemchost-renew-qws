name: Freemchost Auto Renew & Keepalive

on:
  workflow_dispatch:

# 单例运行锁：保证 40 分钟周期内绝不产生重复排队与并发堆叠
concurrency:
  group: freemchost-renew-single
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  browser-auto-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖与 Chromium 内核
        run: |
          npm init -y
          npm install playwright js-yaml
          npx playwright install chromium

      - name: 🚀 启动代理内核并验证出口
        if: ${{ env.NODE_LINK != '' }}
        run: |
          echo "🌐 识别到 NODE_LINK，开始初始化代理转换..."

          # 1. 下载并解压 Mihomo 核心
          wget -qO mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.2/mihomo-linux-amd64-v1.18.2.gz
          gunzip mihomo.gz
          chmod +x mihomo

          # 2. 生成原生配置转换脚本（全面支持 VLESS Reality + Flow Vision）
          cat << 'EOF' > parse_node.js
          const fs = require('fs');
          const url = require('url');
          const yaml = require('js-yaml');
          const nodeLink = (process.env.NODE_LINK || '').trim();

          function parseRawLink(link) {
            link = link.trim();
            if (link.startsWith('vless://')) {
              const u = new url.URL(link);
              const sec = u.searchParams.get('security') || '';
              const node = {
                name: decodeURIComponent(u.hash ? u.hash.replace(/^#/, '') : 'vless-node'),
                type: 'vless',
                server: u.hostname,
                port: parseInt(u.port || '443'),
                uuid: u.username,
                tls: ['tls', 'reality'].includes(sec),
                network: u.searchParams.get('type') || 'tcp'
              };

              // 关键修复：写入 xtls-rprx-vision 握手流控
              if (u.searchParams.get('flow')) node.flow = u.searchParams.get('flow');
              if (u.searchParams.get('sni')) node.servername = u.searchParams.get('sni');
              if (u.searchParams.get('fp')) node['client-fingerprint'] = u.searchParams.get('fp');

              if (sec === 'reality') {
                node['reality-opts'] = {
                  'public-key': u.searchParams.get('pbk') || ''
                };
                if (u.searchParams.get('sid')) {
                  node['reality-opts']['short-id'] = u.searchParams.get('sid');
                }
              }

              if (node.network === 'ws') {
                node['ws-opts'] = { path: u.searchParams.get('path') || '/' };
                if (u.searchParams.get('host')) node['ws-opts'].headers = { Host: u.searchParams.get('host') };
              } else if (node.network === 'grpc') {
                node['grpc-opts'] = { 'grpc-service-name': u.searchParams.get('serviceName') || '' };
              }
              return node;
            }

            if (link.startsWith('hysteria2://') || link.startsWith('hy2://')) {
              const u = new url.URL(link.replace('hy2://', 'hysteria2://'));
              const pwd = u.username || (u.pathname || '').replace(/^\/\//, '').split('@')[0].split(':')[0];
              const node = {
                name: decodeURIComponent(u.hash ? u.hash.replace(/^#/, '') : 'hy2-node'),
                type: 'hysteria2',
                server: u.hostname,
                port: parseInt(u.port || '443'),
                password: pwd
              };
              if (u.searchParams.get('sni')) node.sni = u.searchParams.get('sni');
              if (['1', 'true'].includes(u.searchParams.get('insecure'))) node['skip-cert-verify'] = true;
              return node;
            }

            if (link.startsWith('socks5://') || link.startsWith('socks://')) {
              const u = new url.URL(link);
              return {
                name: 'socks5-node',
                type: 'socks5',
                server: u.hostname,
                port: parseInt(u.port || '1080'),
                username: u.username || '',
                password: u.password || ''
              };
            }

            return null;
          }

          const parsedNode = parseRawLink(nodeLink);
          if (!parsedNode) {
            console.error('❌ 无法解析该节点格式，请检查 NODE_LINK 内容');
            process.exit(1);
          }

          const config = {
            'socks-port': 7891,
            'allow-lan': true,
            'mode': 'global',
            'log-level': 'info',
            'dns': {
              'enable': true,
              'enhanced-mode': 'fake-ip',
              'nameserver': ['8.8.8.8', '1.1.1.1']
            },
            'proxies': [ parsedNode ]
          };

          fs.writeFileSync('config.yaml', yaml.dump(config));
          console.log('✅ Mihomo 配置文件已生成，节点名:', parsedNode.name);
          EOF

          # 3. 运行转换并启动 Mihomo
          node parse_node.js
          nohup ./mihomo -d . -f config.yaml > mihomo.log 2>&1 &
          sleep 4

          # 4. 出口连通性真实检验
          echo "🔍 正在测试代理连通性..."
          PROXY_IP=$(curl -s --max-time 10 --socks5 127.0.0.1:7891 https://api.ip.sb/ip || true)

          if [ -n "$PROXY_IP" ]; then
            echo "🎉 代理成功握手！出口 IP: $PROXY_IP"
            echo "PROXY_URL=socks5://127.0.0.1:7891" >> $GITHUB_ENV
          else
            echo "❌ 代理未连通，查看 Mihomo 日志排查错误:"
            cat mihomo.log
            exit 1
          fi

      - name: 运行保活与自动续期任务
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL || 'yuxiaojie0322@gmail.com' }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD || 'YxJ223512@' }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL || 'https://freemchost.com/app/servers/1df49f71-bb1b-454c-9cd1-70a46422a4f6' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ env.PROXY_URL }}
        run: node renew.js

      - name: 归档运行截图凭据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Freemchost-Screenshots-${{ github.run_number }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 🧹 清理历史运行日志（保留最新 3 次）
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
