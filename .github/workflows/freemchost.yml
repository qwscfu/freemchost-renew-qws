name: Freemchost Auto Renew & Keepalive

on:
  workflow_dispatch:
  schedule:
    # 每天北京时间 08:28 执行（对应 UTC 时间 00:28）
    - cron: '28 0 * * *'

# 保持单例运行，防止并发堆叠
concurrency:
  group: freemchost-renew-single
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  browser-auto-renew:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_LINK: ${{ secrets.NODE_LINK }}

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 缓存 Playwright 浏览器依赖
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-v1

      - name: 安装依赖与 Chromium 内核
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium

      - name: ⚙ 设置sing-box代理
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 运行开机检查与自动续期任务
        env:
          FREE_EMAIL: ${{ secrets.FREE_EMAIL || '' }}
          FREE_PASSWORD: ${{ secrets.FREE_PASSWORD || '' }}
          SERVER_PAGE_URL: ${{ secrets.SERVER_PAGE_URL || 'https://freemchost.com/app/servers/c63915c5-59b1-446a-8b77-9b2ea7bff9f2' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: socks5://127.0.0.1:1080
        run: node renew.js

      - name: 归档运行截图凭据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Freemchost-Screenshots-${{ github.run_number }}
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: 🧹 清理历史运行日志（保留最新 3 次）
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 3
